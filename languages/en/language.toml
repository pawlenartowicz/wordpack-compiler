code = "en"
name = "English"
keys = "surface"            # vocabulary holds words as written, not lemmas
case_sensitive = false      # tokens are lowercased before lookup
# Split off the end of a word before lookup: GloVe 2024 was tokenized with
# CoreNLP, which stores `don't` as `do` + `n't`.
clitics = ["n't", "'s", "'re", "'ve", "'ll", "'d", "'m"]
# Keys matching this are hidden from neighbour readouts; corpus tokens are not filtered by it.
# Hidden: a digit, a capital first letter, or any character other than a lowercase Latin
# letter, ' or - (`u.s.`, `phone_number`, other scripts). The build already drops keys no
# text tokenizes to, such as bare punctuation. Letters are listed as ranges, not \w: R
# matches with (*UCP)^(?:...), where \w also takes combining marks, so Python's re.match
# and R would disagree.
neighbor_filter = '''.*\d|^[A-ZÀÁÂÃÄÅÆÇÈÉÊËÌÍÎÏÐÑÒÓÔÕÖØÙÚÛÜÝÞĄĆĘŁŃÓŚŹŻĈĜĤĴŜŬŠŽĐ]|.*[^a-zß-öø-ÿĀ-ɏḀ-ỿ'-]'''
stopwords_source = "spaCy 3.8.13 English stop words, MIT licence"
